<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <title>Simple Todo App</title>
</head>
<body>
  <button id="theme-toggle" aria-label="Toggle dark/light theme">🌙</button>
  <main class="todo-app">
    <div class="app-header">
      <h1>My Tasks</h1>
      <span id="todo-count" class="todo-count">0 tasks</span>
    </div>
    <div class="input-group">
      <input id="todo-input" type="text" placeholder="What needs to be done?" aria-label="Add a new todo" />
      <button id="add-btn" aria-label="Add todo">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div class="filter-tabs" role="tablist">
      <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
      <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
      <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
    </div>
    <ul id="todo-list" aria-live="polite"></ul>
    <p id="empty-state" class="empty-state">No tasks yet — add one above!</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
